<svg viewBox="0 64 760 800" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif"><defs><marker id="main-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8C93E3"></path></marker><marker id="main-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E41E23"></path></marker></defs><g fill="none" stroke="#8C93E3" stroke-width="1.25"><path d="M200 138V180" marker-end="url(#main-arrow)"></path><path d="M280 220H430" marker-end="url(#main-arrow)"></path><path d="M540 248V302" marker-end="url(#main-arrow)"></path><path d="M540 358V440H310" marker-end="url(#main-arrow)"></path><path d="M200 468V522" marker-end="url(#main-arrow)"></path><path d="M200 578V632" marker-end="url(#main-arrow)"></path><path d="M200 688V730" marker-end="url(#main-arrow)"></path><path d="M187 800H215" marker-end="url(#main-arrow)"></path><path d="M365 800H393" marker-end="url(#main-arrow)"></path><path d="M543 800H571" marker-end="url(#main-arrow)"></path></g><g><path d="M200 260V412" fill="none" stroke="#E41E23" stroke-width="2" marker-end="url(#main-arrow-accent)"></path><text x="212" y="330" font-size="11.5" font-weight="600" fill="#2633D4">да: прошлый заказ</text><text x="212" y="346" font-size="11.5" fill="#6B73C9">сразу ложится в корзину</text></g><g><rect x="90" y="82" width="220" height="56" rx="8" fill="none" stroke="#8C93E3" stroke-width="1.25"></rect><text x="200" y="106" text-anchor="middle" font-weight="600" fill="#2633D4">Открывает приложение</text><text x="200" y="122" text-anchor="middle" font-size="11.5" fill="#6B73C9">вход и адрес уже сохранены</text><text x="78" y="114" text-anchor="end" font-size="11.5" fill="#6B73C9">6</text></g><g><polygon points="120,220 200,180 280,220 200,260" fill="none" stroke="#8C93E3" stroke-width="1.25"></polygon><text x="200" y="224" text-anchor="middle" fill="#2633D4">Повторить заказ?</text><text x="108" y="224" text-anchor="end" font-size="11.5" fill="#6B73C9">4</text></g><text x="355" y="210" text-anchor="middle" font-size="11.5" fill="#6B73C9">нет</text><g><rect x="430" y="192" width="220" height="56" rx="8" fill="none" stroke="#8C93E3" stroke-width="1.25"></rect><text x="540" y="216" text-anchor="middle" font-weight="600" fill="#2633D4">Меню</text><text x="540" y="232" text-anchor="middle" font-size="11.5" fill="#6B73C9">подборки, поиск, «Не ем»</text><text x="662" y="224" font-size="11.5" fill="#6B73C9">1, 3</text></g><g><rect x="430" y="302" width="220" height="56" rx="8" fill="none" stroke="#8C93E3" stroke-width="1.25"></rect><text x="540" y="326" text-anchor="middle" font-weight="600" fill="#2633D4">Карточка блюда</text><text x="540" y="342" text-anchor="middle" font-size="11.5" fill="#6B73C9">состав, вес, количество штук</text></g><text x="552" y="404" font-size="11.5" fill="#6B73C9">добавляет блюда</text><g><rect x="90" y="412" width="220" height="56" rx="8" fill="none" stroke="#8C93E3" stroke-width="1.25"></rect><text x="200" y="436" text-anchor="middle" font-weight="600" fill="#2633D4">Корзина</text><text x="200" y="452" text-anchor="middle" font-size="11.5" fill="#6B73C9">шкала скидки, итог со скидкой</text><text x="78" y="444" text-anchor="end" font-size="11.5" fill="#6B73C9">5</text></g><g><rect x="90" y="522" width="220" height="56" rx="8" fill="none" stroke="#8C93E3" stroke-width="1.25"></rect><text x="200" y="546" text-anchor="middle" font-weight="600" fill="#2633D4">Оформление</text><text x="200" y="562" text-anchor="middle" font-size="11.5" fill="#6B73C9">адрес «Дом», время доставки</text><text x="78" y="554" text-anchor="end" font-size="11.5" fill="#6B73C9">6</text></g><g><rect x="90" y="632" width="220" height="56" rx="8" fill="none" stroke="#8C93E3" stroke-width="1.25"></rect><text x="200" y="656" text-anchor="middle" font-weight="600" fill="#2633D4">Оплата</text><text x="200" y="672" text-anchor="middle" font-size="11.5" fill="#6B73C9">онлайн или при получении</text></g><g><rect x="24" y="730" width="712" height="120" rx="8" fill="#EEF0FC" stroke="#8C93E3" stroke-width="1.25"></rect><text x="40" y="756" font-weight="600" fill="#2633D4">Этапы заказа: уведомление на каждом шаге (гипотеза 2)</text><rect x="37" y="776" width="150" height="48" rx="8" fill="none" stroke="#8C93E3" stroke-width="1.25"></rect><rect x="215" y="776" width="150" height="48" rx="8" fill="none" stroke="#8C93E3" stroke-width="1.25"></rect><rect x="393" y="776" width="150" height="48" rx="8" fill="none" stroke="#8C93E3" stroke-width="1.25"></rect><rect x="571" y="776" width="150" height="48" rx="8" fill="none" stroke="#8C93E3" stroke-width="1.25"></rect><text x="112" y="804" text-anchor="middle" fill="#2633D4">Принят</text><text x="290" y="804" text-anchor="middle" fill="#2633D4">Готовится</text><text x="468" y="804" text-anchor="middle" fill="#2633D4">Курьер в пути</text><text x="646" y="804" text-anchor="middle" fill="#2633D4">Получен</text></g></svg>